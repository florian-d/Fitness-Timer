name: Release and Deploy to FTP

on:
  # Trigger on tag push (version releases)
  push:
    tags:
      - 'v*'
  # Trigger on release creation
  release:
    types: [published]
  # Allow manual trigger
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test -- --coverage --watchAll=false

    - name: Build application
      run: npm run build

    - name: Deploy to SFTP
      run: |
        sudo apt-get update && sudo apt-get install -y lftp
        lftp -u "${{ secrets.SFTP_USERNAME }},${{ secrets.SFTP_PASSWORD }}" \
             -e "set sftp:auto-confirm yes; set ssl:verify-certificate no; mirror -R --verbose ./build/ ./; quit" \
             sftp://${{ secrets.SFTP_HOST }}:${{ secrets.SFTP_PORT }}
